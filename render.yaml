# Render Blueprint: one Docker web service + a free Postgres. Set DEEPSEEK_API_KEY in the dashboard.
services:
  - type: web
    name: healthcheck-qa
    runtime: docker
    plan: free   # free web service: 512MB RAM, sleeps after ~15 min idle (first request then takes ~1 min to wake)
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: healthcheck-db, property: connectionString }
      - key: DEEPSEEK_API_KEY
        sync: false
databases:
  - name: healthcheck-db
    plan: free
