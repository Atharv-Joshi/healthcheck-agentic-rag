# Render Blueprint: one Docker web service + a free Postgres. Set DEEPSEEK_API_KEY in the dashboard.
services:
  - type: web
    name: healthcheck-qa
    runtime: docker
    plan: starter   # embeddings use ONNX Runtime (no torch); confirm Render's RAM per plan before choosing
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: healthcheck-db, property: connectionString }
      - key: DEEPSEEK_API_KEY
        sync: false
databases:
  - name: healthcheck-db
    plan: free
