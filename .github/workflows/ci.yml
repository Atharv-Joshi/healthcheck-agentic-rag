name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hc, POSTGRES_PASSWORD: hc, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hc" --health-interval 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://hc:hc@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      # CPU-only torch: the default wheel pulls ~2GB of CUDA libraries
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run build
