services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: healthcheck_qa
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: hc
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc -d healthcheck_qa"]
      interval: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg2://hc:hc@db:5432/healthcheck_qa
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports: ["8000:8000"]
    volumes: [chroma:/app/chroma_db]
volumes:
  pgdata:
  chroma:
